# STS2Agent 配置模板 —— 复制为 config/config.toml 后填写真实值。
# 密钥勿写在此文件或入库；api_key 留空则从环境变量 STS2_OPENAI_API_KEY / .env 读取。

[model]
endpoint = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
context_length = 128000
thinking_mode = false
price_in = 0.15   # 每百万输入 token 美元
price_out = 0.60  # 每百万输出 token 美元

[mcp]
# 真实 STS2MCP：stdio 拉起 Python MCP server，转发游戏 Mod 的 HTTP API(localhost:15526)
command = "uv"
args = ["run", "--directory", "/home/aaa12321/sts2mcp/STS2MCP/mcp", "python", "server.py"]
# 演示用 Mock（待实现后切换）：command = "sts2-mcp-mock"

[decision]
engine = "rule_based"  # rule_based(内置)；预留 mcts / remote

[budget]
token_limit = 0       # 0 = 不限；超出自动中断
cost_limit_usd = 0.0  # 0.0 = 不限

[storage]
sessions_dir = "data/sessions"
logs_dir = "data/logs"
